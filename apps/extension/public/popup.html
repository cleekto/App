<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* DESIGN.md §25: расширение должно ощущаться как инструмент браузера,
         а не как уменьшенная CRM. Одно действие, компактно, без лишнего.

         Шрифт обязан покрывать мхедрули: popup тоже трёхъязычный.
         `text-transform: uppercase` не используется нигде — у грузинского
         нет заглавных букв (правило 18). */
      :root {
        --surface: #ffffff;
        --text-primary: #2b2f38;
        --text-secondary: #6b7280;
        --border: #e8eaed;
        --accent: #1f6feb;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: var(--surface);
        color: var(--text-primary);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Noto Sans',
          'Noto Sans Georgian',
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      p {
        margin: 8px 0 0;
        color: var(--text-secondary);
      }
      .divider {
        margin: 12px 0 0;
        border-top: 1px solid var(--border);
        padding-top: 12px;
      }
      label {
        display: block;
        margin-top: 10px;
        color: var(--text-secondary);
        font-size: 13px;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 4px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font: inherit;
        color: inherit;
      }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.plain {
        margin-top: 8px;
        background: transparent;
        color: var(--text-secondary);
        font-weight: 400;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1 id="app-name"></h1>
    <p id="tagline"></p>

    <div class="divider">
      <form id="sign-in" hidden>
        <p id="state"></p>
        <label id="label-email" for="email"></label>
        <input id="email" type="email" autocomplete="username" required />
        <label id="label-password" for="password"></label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button id="submit" type="submit"></button>
        <p id="sign-in-error" hidden></p>
      </form>

      <div id="signed-in" hidden>
        <p id="who"></p>
        <p id="hint"></p>
        <button id="sign-out" class="plain" type="button"></button>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
