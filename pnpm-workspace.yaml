packages:
  - 'apps/*'
  - 'packages/*'

# pnpm по умолчанию не выполняет postinstall-скрипты зависимостей — правильное
# поведение, потому что произвольный код при установке это способ доставки
# вредоносного пакета.
#
# Разрешены только те, без которых пакет физически не работает:
#   prisma, @prisma/client, @prisma/engines — скачивают бинарный движок запросов;
#   esbuild                                 — скачивает нативный бинарник сборщика.
#
# Новый пакет в этом списке требует обоснования в отчёте, как и любая
# новая зависимость.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
