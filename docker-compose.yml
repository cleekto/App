# Локальная база одной командой: pnpm db:up
#
# Расширения pg_trgm и pgcrypto включает первая миграция, а не этот файл:
# они часть схемы, и на любой другой базе должны появиться тем же способом.

services:
  postgres:
    image: postgres:17-alpine
    container_name: cleekto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleekto
      POSTGRES_PASSWORD: cleekto_local_dev
      POSTGRES_DB: cleekto
      # Грузинский, русский и английский в одной базе — сортировка должна
      # вести себя предсказуемо для всех трёх (ADR-0008).
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=und --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cleekto -d cleekto']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
