
# Фоновое наполнение рабочей ленты — частые прогоны внутри рабочих окон.
#
# ПОЧЕМУ РАСПИСАНИЕ В ДВУХ МЕСТАХ.
#
# Аккаунт Vercel на тарифе Hobby: там разрешены два задания, каждое не чаще
# раза в сутки. Выкладка с более частым расписанием отклоняется прямой
# ошибкой площадки — «Hobby accounts are limited to daily cron jobs».
#
# Поэтому обязанности разделены, и разделены осмысленно:
#
#   vercel.json — 09:30 и 15:00, НАЧАЛА окон. Планировщик Vercel точен,
#                 и два самых важных прогона гарантированы даже если
#                 этот файл отключат.
#   этот файл   — всё, что между: 09:45, 10:00, 10:15, 10:30
#                 и 15:15, 15:30, 15:45, 16:00.
#
# Минуты не пересекаются намеренно: два прогона в одну минуту читали бы
# одни и те же страницы и выглядели бы со стороны площадки хуже, чем один.
#
# Станет тариф Pro — этот файл удаляется, все окна возвращаются
# в vercel.json. Маршрут и секрет у них общие, менять больше нечего.
#
# ЧЕСТНАЯ ОГОВОРКА: расписание GitHub Actions не точное. Под нагрузкой
# запуск сдвигается на пять-пятнадцать минут. Ленте это безразлично —
# она копит объявления, а не отсчитывает секунды, — но обещать «ровно
# в 09:45» нельзя. Начала окон держит Vercel, и вот они точны.

name: Рабочая лента

on:
  schedule:
    # Время в UTC. Тбилиси — UTC+4 круглый год: перевод часов Грузия
    # отменила, поэтому окна не уезжают дважды в год.
    - cron: '45 5 * * *' # 09:45
    - cron: '0,15,30 6 * * *' # 10:00, 10:15, 10:30
    - cron: '15,30,45 11 * * *' # 15:15, 15:30, 15:45
    - cron: '0 12 * * *' # 16:00
  # Кнопка «Run workflow» на вкладке Actions: пригодится в первый день
  # и всякий раз, когда захочется проверить сборщик, не дожидаясь окна.
  workflow_dispatch:

# Двум прогонам одновременно делать нечего: они читали бы одни и те же
# страницы и мешали друг другу в очереди опознания продавцов.
concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Прогон сборщика
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://app-web-tau-five.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Секрет CRON_SECRET не задан в настройках репозитория."
            echo "Без него маршрут отвечает «не найдено» — это защита, а не поломка."
            exit 1
          fi

          # --fail-with-body — чтобы в журнале осталась причина отказа,
          # а не только код возврата. Ответ печатается целиком: телефонов
          # в нём нет и быть не может, только счётчики прогона.
          curl --silent --show-error --fail-with-body \
            --max-time 300 \
            --request POST \
            --header "authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/v1/collector/run"
